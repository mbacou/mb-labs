meta:
  name: Mel B. Labs (emacs theme)
  logo: assets/mb-square.png
  link:
    home: https://mbacou.github.io/mb-labs
    github: https://github.com/mbacou/mb-labs

color:
  palette:
    gray-800: "#555555"
    gray-300: "#ADADAD"
    gray-200: "#6B6F79"
    gray-100: "#C4C4C4"
    purple:   "#7653C1"
    indigo:   "#204A87"
    blue:     "#4C8fC7"
    green:    "#61862F"
    orange:   "#BC670F"
    ochre:    "#C4A000"
    red:      "#a40000"
    light:    "#FEFEFE"
    dark:     "#1E282C"
    grid:     "#e7e2da"

  foreground: gray-800
  background: light
  primary: orange
  secondary: purple
  tertiary: indigo
  info: blue
  success: green
  warning: ochre
  danger: red
  light: light
  dark: dark

typography:
  fonts:
    - family: Crimson Text
      source: google
      weight: [300, 400, 500, 600]
    - family: Iosevka Charon Mono
      source: google
      weight: [400, 500]
    - family: Caveat
      source: google
      weight: [400]

  base:
    family: Crimson Text
    size: 20px          # $font-size-base ≠ $font-size-root in `_quarto.yml`
  headings: Caveat      # Serif font
  monospace:
    family: Iosevka Charon Mono
    size: 14px          # $code-font-size

defaults:
  bootstrap:
    border-color: gray-800
    border-radius-sm: .5rem
    border-radius: .75rem
    border-radius-lg: 1rem
