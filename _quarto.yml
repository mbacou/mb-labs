project:
  title: mb-labs
  type: website
  execute-dir: file
  output-dir: _site
  preview:
    port: 5555

highlight-style: tango    

website:
  title: "Mel B. mb-labs"
  favicon: assets/mb-square.png
  image: assets/mb-square.png
  twitter-card: false
  description: Playground for consulting and data science projects
  open-graph: true
  site-url: https://mbacou.com
  repo-url: https://github.com/mbacou/mb-labs
  repo-branch: quarto
  repo-actions: [edit, issue]
  back-to-top-navigation: false
  page-navigation: true
  bread-crumbs: false

  navbar:
    title: mb-labs
    foreground: gray-700
    background: transparent
    search: true
    collapse: true
    tools-collapse: false
    toggle-position: left
    right: 
      - text: Notebooks
        href: index.qmd
      - text: Portfolio
        href: portfolio.qmd
      - text: Ressources
        href: /posts/tools/
      - text: Bio / CV
        href: /posts/resume/
    tools:
      - icon: github
        href: https://github.com/mbacou/mb-labs
      - icon: telegram
        href: https://t.me/mbacou
      - icon: linkedin
        href: https://linkedin.com/in/mbacou
  
  sidebar:
    style: docked
    pinned: true
    border: false
    alignment: right   

  search:
    type: textbox
    show-item-context: true

  announcement:
    dismissable: true
    type: dark
    content: "{{< bi warning >}} This blog is being migrating to [Quarto](https://quarto.org), expect quirks and dead links!"

  page-footer:
    left: |
      **Mel B. Labs** -- a personal blog about econometrics and statistics.<br/>
      BACOU, Melanie &copy; 2024 /
      Licensed under [CC BY-NC 4.0](/license.qmd).

      [All views here are strictly my own and do <u>not</u> reflect that of employers,
      project partners or clients. Refer to each article for citation, code and data reuse.]{.text-muted}

      This site is generated using [Quarto&reg;](https://quarto.org).
    right:
      - icon: github
        href: https://github.com/mbacou
      - icon: telegram
        href: https://t.me/mbacou
      - icon: linkedin
        href: https://linkedin.com/in/mbacou
      - icon: youtube
        href: https://www.youtube.com/@mbacou/playlists  
      - icon: rss
        href: index.xml      

bibliography: references.bib

format:
  html:
    toc: true
    toc-title: Contents
    toc-location: left
    toc-depth: 3
    smooth-scroll: true
    date-format: medium

    link-external-icon: false
    link-external-newwindow: true
    title-block-banner: var(--bs-shaded)

    tbl-cap-location: bottom
    fig-cap-location: bottom
    reference-location: margin
    citation-location: document
    citations-hover: true
    footnotes-hover: false

    fig-dpi: 110
    fig-format: png
    fig-width: 7
    fig-height: 5

    code-copy: false
    code-overflow: wrap

    fontsize: 15px
    theme:
      light:
        - ./assets/scss/_theme.scss
        - brand

    grid:
      body-width: 720px
      sidebar-width: 190px
      margin-width: 210px
      gutter-width: 30px
