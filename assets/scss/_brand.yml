meta:
  name: Mel B. Labs
  link:
    home: https://mbacou.github.io/mb-labs
    github: https://github.com/mbacou/mb-labs

color:
  palette:
    cyan:      "#789494"
    teal:      "#445e64"
    dark:      "#222e32"
    green:     "#27ae60"
    blue:      "#3daee9"
    purple:    "#9b59b6"
    pink:      "#aea39a"
    indigo:    "#98796f"
    yellow:    "#eed04c"
    orange:    "#ffac5e"
    red:       "#da4453"
    light:     "#fdfcf9"
    gray:      "#505050"
  
  foreground:   gray
  background:   light
  primary:      mix(red, light, 75%)
  secondary:    purple
  info:         mix(blue, dark, 50%)

typography:
  fonts:
    - family: Crimson Text
      source: google
      weight: [400, 500, 600]
    - family: M PLUS Code Latin
      source: google
      weight: [400, 500]
    - family: Marck Script
      source: google
      weight: [400]
  
  base: Crimson Text
  headings: Marck Script
  monospace: M PLUS Code Latin

  
